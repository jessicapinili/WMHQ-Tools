<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMHQ Tools | Woman Mastery HQ</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root {
  --deep-red: #660810;
  --dark-red: #3D0D0C;
  --merlot: #3D0D0C;
  --blush: #F2C6D0;
  --stone: #f1ebeb;
  --off-white: #f2f2f2;
  --card-bg: #ffffff;
  --card-soft: #f7f7f7;
  --ink: #1a0a0a;
  --muted: #7a5a5a;
  --taupe: #7a5a5a;
  --border: rgba(61,13,12,0.09);
  --border-strong: rgba(61,13,12,0.2);
  --green-ok: #4E8A52;
  --sidebar-w: 260px;
}

/* pillar tokens */
.pillar-influence    { --pillar: #E6EDFA; --pillar-deep: #6E86B5; }
.pillar-visibility   { --pillar: #FBEEE4; --pillar-deep: #B88A66; }
.pillar-cash         { --pillar: #E6EFE7; --pillar-deep: #7A9C7C; }
.pillar-identity     { --pillar: #EDE8F4; --pillar-deep: #8E7EB0; }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

/* ============ SIDEBAR ============ */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--dark-red);
  padding: 34px 24px 30px;
  display: flex;
  flex-direction: column;
  z-index: 60;
  overflow: hidden;
}
.sidebar::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(241,235,235,0.03) 60px);
  pointer-events: none;
}
.sb-brand { position: relative; z-index: 2; }
.sb-wordmark {
  font-size: 17px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--stone); line-height: 1.15;
}
.sb-eyebrow {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--blush);
  margin-top: 8px;
}
.sb-divider {
  height: 1px; background: rgba(241,235,235,0.12);
  margin: 26px 0 22px; position: relative; z-index: 2;
}
.sb-nav { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.sb-link {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
  color: rgba(241,235,235,0.72);
  text-decoration: none;
  padding: 11px 14px; border-radius: 10px;
  transition: background 0.18s ease, color 0.18s ease;
}
.sb-link:hover { background: rgba(241,235,235,0.06); color: var(--stone); }
.sb-link.active { background: rgba(241,235,235,0.09); color: var(--stone); }
.sb-link .arr { font-size: 12px; opacity: 0.55; }
.sb-group-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(242,198,208,0.55);
  padding: 0 14px; margin: 22px 0 8px; position: relative; z-index: 2;
}
.sb-foot {
  margin-top: auto; position: relative; z-index: 2;
  font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(241,235,235,0.4);
}

/* ---- WMHQ Voice Vault card ---- */
.sb-vault {
  position: relative; z-index: 2;
  display: block; text-decoration: none;
  margin: 26px 0 4px;
  padding: 18px 14px 13px;
  border: 1.5px dotted var(--blush);
  border-radius: 12px;
  background: rgba(242,198,208,0.06);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.sb-vault:hover {
  background: rgba(242,198,208,0.12);
  border-color: #f7dbe2;
  transform: translateY(-2px);
}
.sb-vault-tag {
  position: absolute; top: -9px; left: 14px;
  font-size: 8.5px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dark-red); background: var(--blush);
  padding: 3px 8px; border-radius: 999px;
  box-shadow: 0 0 0 4px var(--dark-red);
}
.sb-vault-title {
  display: block; margin-top: 2px;
  font-size: 14px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--stone); line-height: 1.25;
}
.sb-vault-sub {
  display: block;
  font-size: 11px; font-weight: 500; line-height: 1.45;
  color: rgba(241,235,235,0.62);
  margin-top: 5px;
}
.sb-vault-cta {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--blush);
  margin-top: 11px;
}
.sb-vault-cta .arr { font-size: 11px; }

@media (prefers-reduced-motion: reduce) {
  .sb-vault { transition: none; }
  .sb-vault:hover { transform: none; }
}
